run_name: baseline
seed: 42
data:
  root: data
  img_size: 64
  val_fraction: 0.1
  num_workers: 2
  augment:
    rotation: 10
    color_jitter:
      brightness: 0.3
      contrast: 0.3
      saturation: 0.3
      hue: 0.02
model:
  name: resnet18
  num_classes: 43
  pretrained: true
  remove_maxpool: true
train:
  epochs: 15
  batch_size: 256
  lr: 0.001
  weight_decay: 0.05
  pct_start: 0.2
  label_smoothing: 0.1
  amp: true
  log_every: 50
robust:
  enabled: false
